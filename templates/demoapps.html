<!DOCTYPE html>
<html style="height: -webkit-fill-available; background-color: #eafcec;">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>demoapps</title>
		<link rel="stylesheet" href="/css/common.css" >
		<link rel="stylesheet" href="/css/bootstrap.min.css" >
		<link rel="stylesheet" href="/css/all.css">
		<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
	</head>
	<body style="height: -webkit-fill-available;">
		<div class="navbar" style="background: white;">
			<div class="container">
				<div class="navbar-header" style="height: fit-content; overflow: hidden;">
					<a class="navbar-brand" rel="home" href="/" title="Identicum">
						<img style="max-width:300px; height: 100px; margin-right: 0px" src="/img/logo.png"> <span style="color: #3fac40">| demoapps</span>
					</a>
				</div>
			</div>
		</div>
		<div class="container" style="margin-top: 2rem; max-width: 40rem;">
			{% if #demoapps == 0 then %}
			<div class="alert alert-warning">No demo apps configured. Mount one <code>.conf</code> file per app in <code>/var/ipax/demoapps/</code>.</div>
			{% else %}
			<div class="list-group">
				{% for _, demoapp in ipairs(demoapps) do %}
				<a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" href="/{{demoapp.name}}/">
					<span>{{demoapp.display_name}}</span>
					<small class="text-muted">/{{demoapp.name}}/</small>
				</a>
				{% end %}
			</div>
			{% end %}
		</div>
	</body>
</html>
