set $template_root /var/ipax/templates;

include /var/ipax/conf/location_norobots.conf;
include /var/ipax/conf/location_health.conf;

location / {
    add_header Cache-Control no-store;
    add_header Pragma no-cache;
    default_type text/html;
    content_by_lua_block {
        -- /var/ipax/demoapps.json is created by /entrypoint.sh
        local data = { demoapps = {} }
        local file = io.open("/var/ipax/demoapps.json", "r")
        if file then
            data.demoapps = require("cjson").decode(file:read("*a"))
            file:close()
        else
            ngx.log(ngx.WARN, "/var/ipax/demoapps.json not found")
        end
        require("resty.template").render_file("demoapps.html", data)
    }
}

# static content used by demoapps.html
location ~ ^/(css|img|js)/ {
    root /var/ipax/html;
}
location = /favicon.ico {
    root /var/ipax/html;
}
