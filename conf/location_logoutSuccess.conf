# public page, where the IdP redirects after logout (OIDC_POST_LOGOUT_REDIRECT_URI)
# matches /logoutSuccess[.html] and, in "demoapps" mode, /<demoapp>/logoutSuccess[.html]
location ~ ^(/[^/]+)?/logoutSuccess(\.html)?$ {
	set $template_root /var/ipax/templates;
	add_header Cache-Control no-store;
	add_header Pragma no-cache;
	default_type text/html;

	content_by_lua_block {
		require("resty.template").render_file("logoutSuccess.html")
	}
}
