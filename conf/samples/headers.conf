server {
	server_name wtp.identicum.com;

	include /var/ipax/conf/ssl/default.settings;
	include /var/ipax/conf/location_norobots.conf;

	set $oidc_redirect_uri 'https://wtp.identicum.com/private/redirect_uri';
	set $oidc_post_logout_redirect_uri 'https://wtp.identicum.com/logoutSuccess.html';

	location / {
		access_by_lua_block {
			local ipax = require "ipax"
			local oidc_opts = ipax.get_oidc_opts()
			local session_opts = ipax.get_session_opts()
			ngx.ctx.res = ipax.get_res(oidc_opts, session_opts)
			local user = ipax.get_user(ngx.ctx.res)
			ngx.req.set_header("IPAx-USERNAME", user.preferred_username)
			ngx.req.set_header("IPAx-EMAIL", user.email)
			-- member_of holds group DNs; send only the group names (CN), separated by "|"
			ngx.req.set_header("IPAx-ROLES", ipax.get_ldap_object_names(user.member_of, "|"))
		}
		proxy_pass http://wtp.internal.com:8080/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

		# filter lua-resty-openidc/lua-resty-session cookie, to prevent HTTP error 413 in the app server
		proxy_set_header Cookie $filtered_cookie;
	}
}
