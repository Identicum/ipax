server {
	server_name authz.identicum.com;

	include /var/ipax/conf/ssl/default.settings;
	include /var/ipax/conf/location_norobots.conf;

	set $oidc_redirect_uri 'https://authz.identicum.com/private/redirect_uri';
	set $oidc_post_logout_redirect_uri 'https://authz.identicum.com/logoutSuccess.html';

	location / {
		access_by_lua_block {
			local ipax = require "ipax"
			local oidc_opts = ipax.get_oidc_opts()
			local session_opts = ipax.get_session_opts()
			ngx.ctx.res = ipax.get_res(oidc_opts, session_opts)
			local user = ipax.get_user(ngx.ctx.res)
			-- returns HTTP 403 if the user is not a member of the group
			ipax.check_multivalued_user_claim(user.member_of or {}, "CN=MyGroup,OU=Groups,DC=identicum,DC=com")
		}
		proxy_pass http://authz.internal.com:8080/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

		# filter lua-resty-openidc/lua-resty-session cookie, to prevent HTTP error 413 in the app server
		proxy_set_header Cookie $filtered_cookie;
	}
}
