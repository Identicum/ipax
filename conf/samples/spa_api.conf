server {
	server_name spa.identicum.com;

	include /var/ipax/conf/ssl/default.settings;
	include /var/ipax/conf/location_norobots.conf;

	set $oidc_redirect_uri 'https://spa.identicum.com/private/redirect_uri';
	set $oidc_post_logout_redirect_uri 'https://spa.identicum.com/logoutSuccess.html';

	# SPA static files, served by IPAx
	location / {
		access_by_lua_block {
			local ipax = require "ipax"
			local oidc_opts = ipax.get_oidc_opts()
			local session_opts = ipax.get_session_opts()
			ngx.ctx.res = ipax.get_res(oidc_opts, session_opts)
		}
		root /var/ipax/html;
		try_files $uri $uri/ /index.html;
	}

	# API calls from the SPA, forwarded with the user's access token
	location /api/ {
		set $api_base_url '';
		access_by_lua_block {
			local ipax = require "ipax"
			local oidc_opts = ipax.get_oidc_opts()
			local session_opts = ipax.get_session_opts()
			ngx.ctx.res = ipax.get_res(oidc_opts, session_opts)
			-- API_BASE_URL must have no path (e.g. http://api.internal:8080), so the request URI is forwarded as is
			ngx.var.api_base_url = os.getenv("API_BASE_URL")
			ngx.req.set_header("Authorization", "Bearer " .. ipax.get_access_token(ngx.ctx.res))
		}
		proxy_pass $api_base_url;
		proxy_set_header Cookie "";
	}
}
