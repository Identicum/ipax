server {
	listen 80 default_server;
	include /var/ipax/conf/default_variables.conf;

	include /var/ipax/conf/location_norobots.conf;
	include /var/ipax/conf/location_health.conf;
	include /var/ipax/conf/location_logoutSuccess.conf;

	location / {
		root /var/ipax/html/;
		add_header Cache-Control no-store;
		add_header Pragma no-cache;
		default_type text/html;
		access_by_lua_block {
			local ipax = require "ipax"
			local oidc_opts = ipax.get_oidc_opts()
			local session_opts = ipax.get_session_opts()
			ngx.ctx.res = ipax.get_res(oidc_opts, session_opts)
		}
	}

	# API calls from the SPA, forwarded to API_BASE_URL with the user's access token
	# ^~: regex locations (e.g. location_logoutSuccess.conf) don't take /api/ requests
	location ^~ /api/ {
		access_by_lua_block {
			local ipax = require "ipax"
			local oidc_opts = ipax.get_oidc_opts()
			local session_opts = ipax.get_session_opts()
			-- "deny": HTTP 401 instead of a redirect to the IdP
			ngx.ctx.res = ipax.get_res(oidc_opts, session_opts, "deny")
			-- don't send the IPAx session cookies to the API (prevents HTTP error 413)
			ipax.filter_session_cookies(session_opts)
			ngx.req.set_header("Authorization", "Bearer " .. ipax.get_access_token(ngx.ctx.res))
			-- API_BASE_URL must have no path (e.g. http://api.internal:8080), so the request URI is forwarded as is
			ngx.var.api_base_url = ipax.get_var_or_env("api_base_url")
		}
		proxy_pass $api_base_url;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}
}
