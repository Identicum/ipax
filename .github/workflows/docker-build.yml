name: docker-build

on:
  push:
    branches:
    - main
    paths:
    - 'conf/**'
    - 'html/**'
    - 'lua/**'
    - 'templates/**'
    - 'Dockerfile'
    - 'entrypoint.sh'
  workflow_dispatch:

jobs:
  docker-build:
    uses: Identicum/github-actions/.github/workflows/docker-build-autotag.yml@main
    with:
      image_name: ${{github.event.repository.name}}
